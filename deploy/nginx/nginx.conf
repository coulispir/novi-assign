events {}

http {
    # Docker's embedded DNS; re-resolve so replicas that restart with new IPs are picked up
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream wallet_api {
        zone wallet_api 64k;

        # Resolves to every webapi replica; requests are spread round-robin
        server webapi:8080 resolve;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://wallet_api;
            proxy_set_header Host $host;

            # nginx is the edge: overwrite (not append) so a client-supplied X-Forwarded-For never reaches the API
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Shows which replica served the request, including rejected (429) ones
            add_header X-Upstream $upstream_addr always;
        }
    }
}
